# Two agents (one Agent item per agent) and a goal between them.
!ArenaConfig
arenas:
  0: !Arena
    passMark: 0
    timeLimit: 250
    items:
      - !Item
        name: Agent
        positions:
          - !Vector3 { x: 10, y: 0, z: 20 }
        rotations: [90]
      - !Item
        name: Agent
        positions:
          - !Vector3 { x: 30, y: 0, z: 20 }
        rotations: [270]
      - !Item
        name: GoodGoal
        positions:
          - !Vector3 { x: 20, y: 0, z: 30 }
        sizes:
          - !Vector3 { x: 2, y: 2, z: 2 }
